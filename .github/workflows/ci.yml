name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Clang 20)
            os: ubuntu-24.04
            preset: linux-clang-debug
            vcpkg_cache: ~/.cache/vcpkg/archives
            validation: true
          # Prüft Job-System, Allokatoren und parallele Systeme der Welt auf Datenrennen.
          - name: Linux (Clang 20, ThreadSanitizer)
            os: ubuntu-24.04
            preset: linux-clang-tsan
            vcpkg_cache: ~/.cache/vcpkg/archives
            tsan: true
          - name: Windows (MSVC)
            os: windows-latest
            preset: windows-msvc-debug
            vcpkg_cache: ~\AppData\Local\vcpkg\archives

    steps:
      - uses: actions/checkout@v5

      - name: Werkzeuge installieren (Linux)
        if: runner.os == 'Linux'
        # Linux baut mit der Baseline (ADR 0017): nur Pakete aus Ubuntu 24.04 und dessen CMake 3.28.
        # Der Runner bringt ein neueres CMake mit; die Baseline-Version kommt deshalb über pipx.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-20 clang-tools-20 libstdc++-14-dev \
            mesa-vulkan-drivers xvfb dotnet-sdk-10.0 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxft-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
          pipx install cmake==3.28.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Entspricht einer Developer-Konsole: VsDevCmd.bat ausführen und ihre Umgebung übernehmen.
      - name: MSVC-Umgebung einrichten (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Kein Visual Studio mit C++-Werkzeugen gefunden" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$devcmd`" -arch=amd64 -host_arch=amd64 -no_logo && set" | ForEach-Object {
            # Nur geänderte Variablen übernehmen (PATH, INCLUDE, LIB usw.).
            if ($_ -match '^([^=]+)=(.*)$' -and
                [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      # Unter Linux kommt .NET 10 aus den Paketquellen von Ubuntu 24.04 (siehe oben).
      - name: .NET 10 installieren (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: vcpkg holen
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # Wiederherstellen und Speichern getrennt: Der Cache wird direkt nach dem Konfigurieren
      # gesichert (dort baut vcpkg die Pakete), auch wenn später Bauen oder Tests scheitern.
      - name: vcpkg-Cache laden
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.vcpkg_cache }}
          key: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      # Unter Linux kommen die Validation Layers aus vcpkg (Feature "validation"), weil
      # Ubuntu 24.04 nur 1.3 hat. Der Loader findet das Manifest über VK_ADD_LAYER_PATH; die
      # Bibliothek darin steht ohne Pfad und wird über LD_LIBRARY_PATH gefunden.
      - name: Validation Layers aus vcpkg (Linux)
        if: ${{ matrix.validation }}
        run: |
          installed="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/vcpkg_installed/x64-linux"
          echo "VK_ADD_LAYER_PATH=$installed/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$installed/lib" >> "$GITHUB_ENV"

      - name: Konfigurieren
        run: >-
          cmake --preset ${{ matrix.preset }} -DNGINE_WARNINGS_AS_ERRORS=ON
          ${{ matrix.validation && '-DVCPKG_MANIFEST_FEATURES=validation' || '' }}

      - name: vcpkg-Cache speichern
        if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ matrix.vcpkg_cache }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Bauen
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Testen
        if: ${{ !matrix.tsan }}
        run: ctest --preset ${{ matrix.preset }}
        env:
          # Unter Linux steht lavapipe bereit: GPU-Tests dürfen dort nicht übersprungen werden.
          NGINE_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
          # .NET ist überall installiert: Skript-Tests dürfen nicht übersprungen werden.
          NGINE_REQUIRE_DOTNET: '1'

      # Nur die Tests ohne GPU: Treiber wie lavapipe sind nicht für ThreadSanitizer gebaut.
      # Mehrere Durchläufe, weil Datenrennen nicht bei jedem Lauf auftreten.
      - name: ThreadSanitizer
        if: ${{ matrix.tsan }}
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: |
          # Ältere TSan-Laufzeiten scheitern an der hohen ASLR-Entropie aktueller Kernel.
          sudo sysctl -w vm.mmap_rnd_bits=28
          for run in 1 2 3 4 5; do
            build/${{ matrix.preset }}/tests/ngine_tests "[jobs],[memory],[world]"
          done

      - name: Sandbox ohne Fenster starten
        if: ${{ !matrix.tsan }}
        shell: bash
        run: |
          exe="build/${{ matrix.preset }}/apps/sandbox/ngine_sandbox"
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --headless
          "$exe" --jobs-demo --frames 10
          "$exe" --scene-demo --frames 10 --scene "build/${{ matrix.preset }}/scene-demo.json"
          "$exe" --voxel-demo --headless --frames 60
          "$exe" --script-demo --frames 60
          "$exe" --net-demo --frames 120

      # Netzwerk (D3) mit zwei Prozessen: dedizierter Server und Client über localhost.
      - name: Server und Client starten
        if: ${{ !matrix.tsan }}
        shell: bash
        run: |
          exe="build/${{ matrix.preset }}/apps/sandbox/ngine_sandbox"
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --server --port 27020 --frames 600 &
          server=$!
          "$exe" --client 127.0.0.1:27020 --frames 240
          wait "$server"

      # Unter Linux zeichnet die Sandbox 60 Frames in ein virtuelles Fenster (Xvfb) mit
      # lavapipe. Das prüft Fenster, Swapchain und Validation Layers ohne echte GPU.
      - name: Sandbox mit Fenster starten (Linux, Xvfb)
        if: ${{ runner.os == 'Linux' && !matrix.tsan }}
        run: xvfb-run -a build/${{ matrix.preset }}/apps/sandbox/ngine_sandbox --frames 60

      # Editor (R2.1) im virtuellen Fenster: Docking, Viewport-Textur, UI-Pass über die RHI und
      # Konsole, mit und ohne optionale Stufen, ohne Meldung der Validation Layers. Seit R2.2
      # zusätzlich: Standardszene speichern, wieder öffnen und erneut speichern; beide Dateien
      # müssen textgleich sein.
      - name: Editor mit Fenster starten (Linux, Xvfb)
        if: ${{ runner.os == 'Linux' && !matrix.tsan }}
        run: |
          exe=build/${{ matrix.preset }}/apps/editor/ngine_editor
          xvfb-run -a "$exe" --frames 60 --no-ini --save "$RUNNER_TEMP/szene-a.json"
          xvfb-run -a "$exe" --frames 60 --no-ini --baseline --scene "$RUNNER_TEMP/szene-a.json" \
            --save "$RUNNER_TEMP/szene-b.json"
          cmp "$RUNNER_TEMP/szene-a.json" "$RUNNER_TEMP/szene-b.json"
          # Seit R2.3: 30 Frames spielen und stoppen; die Welt muss danach unverändert sein.
          xvfb-run -a "$exe" --frames 60 --no-ini --play 30 --scene "$RUNNER_TEMP/szene-a.json" \
            --save "$RUNNER_TEMP/szene-c.json"
          cmp "$RUNNER_TEMP/szene-a.json" "$RUNNER_TEMP/szene-c.json"

      # Dasselbe ohne optionale Stufen (Mesh Shader, Raytracing): Die Engine muss auch auf
      # GPUs laufen, die nur die Mindestanforderung erfüllen.
      - name: Sandbox ohne optionale Stufen starten (Linux, Xvfb)
        if: ${{ runner.os == 'Linux' && !matrix.tsan }}
        run: xvfb-run -a build/${{ matrix.preset }}/apps/sandbox/ngine_sandbox --frames 60 --baseline

      # Voxel-Demo (D1) im Fenster mit automatischen Änderungen, mit und ohne optionale Stufen,
      # und offscreen als Bild. Prüft Puffer, Tiefe und Push Constants mit den Validation Layers.
      - name: Voxel-Demo starten (Linux, Xvfb)
        if: ${{ runner.os == 'Linux' && !matrix.tsan }}
        run: |
          exe=build/${{ matrix.preset }}/apps/sandbox/ngine_sandbox
          xvfb-run -a "$exe" --voxel-demo --frames 120
          xvfb-run -a "$exe" --voxel-demo --frames 60 --baseline
          "$exe" --voxel-demo --frames 40 --image build/${{ matrix.preset }}/voxel-demo.ppm
          # Dasselbe 10 000 km vom Ursprung (R1.1): Kamerarelativ gezeichnet muss das Bild bis
          # auf Rundung gleich bleiben. Höchstens 0,1 % der Bytes dürfen abweichen.
          "$exe" --voxel-demo --frames 40 --far --image build/${{ matrix.preset }}/voxel-demo-far.ppm
          size=$(stat -c %s build/${{ matrix.preset }}/voxel-demo.ppm)
          diff=$(cmp -l build/${{ matrix.preset }}/voxel-demo.ppm build/${{ matrix.preset }}/voxel-demo-far.ppm | wc -l || true)
          echo "Abweichende Bytes mit --far: $diff von $size"
          test "$diff" -le $((size / 1000))

      # Kugelraster (R1.3) offscreen: PBR-Materialien, Tone Mapping und Kamera als Komponente.
      # Wie bei der Voxel-Demo muss das Bild 10 000 km vom Ursprung bis auf Rundung gleich bleiben.
      - name: Standardszene als Bild (Linux)
        if: ${{ runner.os == 'Linux' && !matrix.tsan }}
        run: |
          exe=build/${{ matrix.preset }}/apps/sandbox/ngine_sandbox
          out=build/${{ matrix.preset }}
          "$exe" --image $out/scene.ppm
          "$exe" --far --image $out/scene-far.ppm
          "$exe" --baseline --image $out/scene-baseline.ppm
          "$exe" --debug-draw --image $out/scene-debug.ppm
          # 10 000 km vom Ursprung rasten die Schattenkarten auf ein anderes Texelgitter ein:
          # Schattenkanten verschieben sich um Bruchteile eines Texels, sonst bleibt das Bild gleich.
          python3 - $out/scene.ppm $out/scene-far.ppm <<'PY'
          import sys
          a = open(sys.argv[1], 'rb').read()
          b = open(sys.argv[2], 'rb').read()
          assert len(a) == len(b), 'Bilder unterschiedlich groß'
          changed = sum(x != y for x, y in zip(a, b))
          large = sum(abs(x - y) > 8 for x, y in zip(a, b))
          print(f'Abweichende Bytes mit --far: {changed} von {len(a)}, davon {large} um mehr als 8')
          assert changed <= len(a) * 0.03, 'zu viele abweichende Bytes'
          assert large <= len(a) * 0.003, 'zu viele stark abweichende Bytes'
          PY
          # Ohne optionale Stufen zeichnet der Renderer denselben Pfad: gleiches Bild.
          cmp $out/scene.ppm $out/scene-baseline.ppm

      - name: Bilder hochladen
        if: ${{ runner.os == 'Linux' && !matrix.tsan }}
        uses: actions/upload-artifact@v5
        with:
          name: bilder-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/scene.ppm
            build/${{ matrix.preset }}/scene-debug.ppm
            build/${{ matrix.preset }}/voxel-demo.ppm
          if-no-files-found: error
