name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Clang 23)
            os: ubuntu-24.04
            preset: linux-clang-debug
            vcpkg_cache: ~/.cache/vcpkg/archives
          - name: Windows (MSVC)
            os: windows-latest
            preset: windows-msvc-debug
            vcpkg_cache: ~\AppData\Local\vcpkg\archives

    steps:
      - uses: actions/checkout@v5

      - name: Werkzeuge installieren (Linux)
        if: runner.os == 'Linux'
        run: |
          # Aktuelles Clang aus der LLVM-Paketquelle
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-23 clang-tools-23 libstdc++-14-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxft-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev

      - name: MSVC-Umgebung einrichten (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: vcpkg holen
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: vcpkg-Cache
        uses: actions/cache@v5
        with:
          path: ${{ matrix.vcpkg_cache }}
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: Konfigurieren
        run: cmake --preset ${{ matrix.preset }} -DNGINE_WARNINGS_AS_ERRORS=ON

      - name: Bauen
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Testen
        run: ctest --preset ${{ matrix.preset }}
        env:
          # Unter Linux steht lavapipe bereit: GPU-Tests dürfen dort nicht übersprungen werden.
          NGINE_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Sandbox ohne Fenster starten
        shell: bash
        run: |
          exe="build/${{ matrix.preset }}/apps/sandbox/ngine_sandbox"
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --headless

      # Unter Linux zeichnet die Sandbox 60 Frames in ein virtuelles Fenster (Xvfb) mit
      # lavapipe. Das prüft Fenster, Swapchain und Validation Layers ohne echte GPU.
      - name: Sandbox mit Fenster starten (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a build/${{ matrix.preset }}/apps/sandbox/ngine_sandbox --frames 60
